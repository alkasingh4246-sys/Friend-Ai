<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover" />
  <meta name="theme-color" content="#0b1020" />
  <meta name="description" content="Friend-Ai — a simple, friendly AI chat companion." />
  <title>Friend-Ai</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <main class="app">
    <header>
      <div class="brand"><div class="avatar" aria-hidden="true">🤖</div><div><h1>Friend-Ai</h1><p>Always here to chat</p></div></div>
      <button id="clear" class="ghost" type="button" title="Clear chat">Clear</button>
    </header>
    <section id="chat" class="chat" aria-live="polite" aria-label="Chat messages"></section>
    <form id="form" class="composer">
      <textarea id="message" rows="1" maxlength="4000" placeholder="Message Friend-Ai…" autocomplete="off" aria-label="Message"></textarea>
      <button id="send" type="submit" aria-label="Send message">➤</button>
    </form>
    <p class="note">AI can make mistakes • Your API key stays on the server</p>
  </main>
  <script src="/app.js"></script>
</body>
</html>
